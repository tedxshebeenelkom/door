<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Door · TEDxShebeenElkom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
<style>
  :root {
    --red: #EB0028; --ink: #111111; --paper: #ffffff; --soft: #f4f4f3; --line: #e7e7e5; --mute: #6f6f6f; --faint: #a3a3a3;
    --go: #0B8A47; --stop: #EB0028; --warn: #F4B400;
    --font: 'Inter', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --mono: 'SF Mono', ui-monospace, Menlo, Consolas, 'Courier New', monospace;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 16px; -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; min-height: 100dvh; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  [hidden] { display: none !important; }

  /* ---------- shell ---------- */
  .top { position: sticky; top: 0; z-index: 20; background: var(--paper); padding: calc(14px + var(--sat)) 18px 0; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; max-width: 520px; margin: 0 auto; }
  .logo { font-size: 21px; line-height: 1; white-space: nowrap; letter-spacing: -.01em; }
  .logo b { font-weight: 900; color: var(--red); letter-spacing: -.045em; }
  .logo b sup { font-size: .6em; vertical-align: .62em; margin-left: 1px; }
  .logo span { font-weight: 300; }
  .pills { display: flex; gap: 6px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 99px; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; background: var(--soft); color: var(--ink); white-space: nowrap; }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--go); box-shadow: 0 0 0 3px rgba(11,138,71,.16); }
  .pill.off i { background: var(--warn); box-shadow: 0 0 0 3px rgba(244,180,0,.22); }
  .pill.dark { background: var(--ink); color: #fff; }
  .rule { position: relative; max-width: 520px; margin: 14px auto 0; height: 2px; background: var(--ink); }
  .rule::before { content: ""; position: absolute; left: 0; top: -5px; width: 12px; height: 12px; border-radius: 50%; background: var(--red); }
  main { max-width: 520px; margin: 0 auto; padding: 18px 18px calc(110px + var(--sab)); }

  /* ---------- type + controls ---------- */
  .kicker { font-size: 11px; font-weight: 800; letter-spacing: .26em; color: var(--red); text-transform: uppercase; }
  h1 { font-size: 34px; line-height: 1.02; font-weight: 900; letter-spacing: -.03em; margin-top: 10px; }
  .lead { margin-top: 10px; color: var(--mute); font-size: 15px; line-height: 1.55; }
  .field { margin-top: 18px; }
  .field label { display: block; font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: var(--mute); margin-bottom: 8px; }
  .input { width: 100%; height: 54px; padding: 0 16px; border-radius: 14px; border: 2px solid var(--line); background: #fff; font-size: 17px; font-weight: 600; outline: none; transition: border-color .15s; }
  .input:focus { border-color: var(--ink); }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 56px; border-radius: 14px; background: var(--ink); color: #fff; font-size: 15px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; transition: transform .08s, opacity .15s; }
  .btn:active { transform: scale(.985); }
  .btn.red { background: var(--red); }
  .btn.ghost { background: var(--soft); color: var(--ink); }
  .btn:disabled { opacity: .4; }
  .err { margin-top: 12px; min-height: 20px; font-size: 14px; font-weight: 600; color: var(--stop); }
  .note { margin-top: 14px; font-size: 13px; line-height: 1.55; color: var(--mute); }
  .spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.35); border-top-color: #fff; animation: rot .7s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }

  /* ---------- camera ---------- */
  .cam { position: relative; width: 100%; aspect-ratio: 1 / 1; border-radius: 24px; overflow: hidden; background: var(--ink); }
  .cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .frame { position: absolute; inset: 15%; pointer-events: none; }
  .frame i { position: absolute; width: 34px; height: 34px; border: 4px solid #fff; }
  .frame .tl { left: 0; top: 0; border-right: 0; border-bottom: 0; border-radius: 12px 0 0 0; }
  .frame .tr { right: 0; top: 0; border-left: 0; border-bottom: 0; border-radius: 0 12px 0 0; }
  .frame .bl { left: 0; bottom: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 12px; }
  .frame .br { right: 0; bottom: 0; border-left: 0; border-top: 0; border-radius: 0 0 12px 0; }
  .frame .laser { position: absolute; left: 8%; right: 8%; height: 2px; top: 50%; border: 0; width: auto; background: var(--red); box-shadow: 0 0 14px 2px rgba(235,0,40,.7); animation: sweep 1.8s ease-in-out infinite; }
  @keyframes sweep { 0%,100% { top: 12%; } 50% { top: 88%; } }
  .camOff { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 28px; text-align: center; color: #fff;
            background: radial-gradient(circle at 50% 50%, transparent 0 22%, rgba(255,255,255,.05) 22.3% 22.6%, transparent 22.9% 34%, rgba(255,255,255,.05) 34.3% 34.6%, transparent 34.9% 46%, rgba(255,255,255,.05) 46.3% 46.6%, transparent 46.9%), var(--ink); }
  .camOff .btn { width: auto; padding: 0 26px; }
  .camOff p { font-size: 13px; line-height: 1.5; color: #bdbdbd; max-width: 30ch; }
  .camHint { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-size: 11px; font-weight: 800; letter-spacing: .22em; color: rgba(255,255,255,.85); text-transform: uppercase; }
  .torch { position: absolute; right: 12px; top: 12px; width: 44px; height: 44px; border-radius: 50%; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; }
  .torch.on { background: #fff; }
  .torch svg { width: 20px; height: 20px; }

  .manual { display: flex; gap: 8px; margin-top: 12px; }
  .codebox { flex: 1; min-width: 0; display: flex; align-items: center; height: 54px; border-radius: 14px; border: 2px solid var(--line); background: #fff; padding-left: 16px; }
  .codebox:focus-within { border-color: var(--ink); }
  .codebox span { font-family: var(--mono); font-weight: 700; font-size: 18px; color: var(--faint); letter-spacing: .08em; }
  .codebox input { flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: transparent; font-family: var(--mono); font-weight: 700; font-size: 18px; letter-spacing: .14em; text-transform: uppercase; }
  .manual .btn { width: 104px; flex: 0 0 104px; height: 54px; }

  /* ---------- numbers ---------- */
  .stats { margin-top: 18px; border-radius: 20px; background: var(--soft); padding: 18px; }
  .stats-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .big { font-size: 46px; line-height: .9; font-weight: 900; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
  .big small { font-size: 16px; font-weight: 700; color: var(--mute); letter-spacing: 0; margin-left: 4px; }
  .lbl { font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: var(--mute); margin-top: 8px; }
  .meter { position: relative; height: 6px; border-radius: 99px; background: #e2e2e0; margin-top: 16px; overflow: hidden; }
  .meter i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--red); border-radius: 99px; transition: width .4s; }
  .split { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
  .split div { background: #fff; border-radius: 14px; padding: 12px; }
  .split b { display: flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 900; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .split b i { width: 14px; height: 8px; border-radius: 3px; }
  .split span { display: block; font-size: 10px; font-weight: 800; letter-spacing: .16em; color: var(--mute); margin-top: 4px; text-transform: uppercase; }

  .section-h { display: flex; align-items: baseline; justify-content: space-between; margin: 24px 0 8px; }
  .section-h h2 { font-size: 11px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; }
  .section-h small { font-size: 12px; color: var(--mute); }
  .rows { border-top: 1px solid var(--line); }
  .r { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); }
  .r .dot { flex: 0 0 10px; height: 10px; border-radius: 50%; }
  .r .who { flex: 1; min-width: 0; }
  .r .who b { display: block; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .r .who span { display: block; font-size: 12px; color: var(--mute); margin-top: 2px; font-family: var(--mono); letter-spacing: .04em; }
  .r time { font-size: 12px; font-weight: 700; color: var(--mute); font-variant-numeric: tabular-nums; }
  .empty { padding: 18px 0; color: var(--mute); font-size: 14px; }

  /* ---------- desk cards ---------- */
  .card { border: 1.5px solid var(--line); border-radius: 18px; padding: 16px; margin-top: 10px; background: #fff; }
  .card.pend { border-style: dashed; border-color: #d9c27a; background: #fffbea; }
  .card h3 { font-size: 17px; font-weight: 800; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card .meta { font-size: 13px; color: var(--mute); margin-top: 6px; line-height: 1.5; }
  .card .meta code { font-family: var(--mono); font-weight: 700; color: var(--ink); letter-spacing: .06em; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 99px; font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
  .chip.red { background: var(--red); color: #fff; } .chip.black { background: var(--ink); color: #fff; }
  .chip.in { background: rgba(11,138,71,.12); color: var(--go); } .chip.void { background: #eee; color: var(--mute); }
  .chip.wait { background: var(--warn); color: var(--ink); }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .actions .btn { height: 44px; font-size: 12px; border-radius: 12px; }
  .price { display: flex; align-items: baseline; gap: 8px; }
  .price b { font-size: 56px; font-weight: 900; letter-spacing: -.04em; line-height: 1; }
  .price span { font-size: 14px; font-weight: 800; letter-spacing: .16em; color: var(--mute); }
  ol.steps { list-style: none; counter-reset: s; margin-top: 14px; }
  ol.steps li { counter-increment: s; display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.5; }
  ol.steps li::before { content: counter(s, decimal-leading-zero); font-size: 12px; font-weight: 900; color: var(--red); padding-top: 2px; }
  .vf { font-family: var(--mono); font-weight: 800; letter-spacing: .06em; }

  /* ---------- tabs (desk) ---------- */
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: rgba(255,255,255,.96); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 8px 12px calc(8px + var(--sab)); }
  .tabs div { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .tabs button { height: 48px; border-radius: 12px; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
  .tabs button.on { background: var(--ink); color: #fff; }

  /* ---------- verdict ---------- */
  .verdict { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
             padding: calc(28px + var(--sat)) 26px calc(28px + var(--sab)); color: #fff; overflow: hidden; animation: pop .16s ease-out; }
  @keyframes pop { from { transform: scale(1.04); } to { transform: none; } }
  .verdict.go { background: var(--go); } .verdict.stop { background: var(--stop); } .verdict.warn { background: var(--warn); color: var(--ink); } .verdict.wait { background: var(--ink); }
  .verdict::before { content: ""; position: absolute; left: 50%; top: 42%; width: 1400px; height: 1400px; transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none;
                     background: repeating-radial-gradient(circle, transparent 0 62px, rgba(255,255,255,.08) 62px 64px); }
  .verdict.warn::before { background: repeating-radial-gradient(circle, transparent 0 62px, rgba(0,0,0,.06) 62px 64px); }
  .verdict > * { position: relative; }
  .v-k { font-size: 13px; font-weight: 800; letter-spacing: .3em; text-transform: uppercase; opacity: .9; }
  .v-ic { width: 108px; height: 108px; border-radius: 50%; background: rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center; margin: 22px 0 18px; }
  .verdict.warn .v-ic { background: rgba(0,0,0,.08); }
  .v-ic svg { width: 56px; height: 56px; }
  .v-t { font-size: 40px; line-height: 1; font-weight: 900; letter-spacing: -.03em; text-transform: uppercase; }
  .v-n { font-size: 30px; line-height: 1.12; font-weight: 800; letter-spacing: -.02em; margin-top: 16px; max-width: 16ch; overflow-wrap: anywhere; }
  .v-d { font-size: 16px; line-height: 1.5; font-weight: 500; margin-top: 12px; max-width: 30ch; opacity: .95; }
  .v-band { display: flex; align-items: center; gap: 14px; margin-top: 26px; background: #fff; color: var(--ink); border-radius: 18px; padding: 14px 20px 14px 16px; text-align: left; box-shadow: 0 18px 40px -20px rgba(0,0,0,.5); }
  .v-band i { width: 58px; height: 22px; border-radius: 6px; }
  .v-band b { display: block; font-size: 18px; font-weight: 900; letter-spacing: .04em; }
  .v-band span { display: block; font-size: 13px; color: var(--mute); font-weight: 600; margin-top: 2px; }
  .v-m { margin-top: 18px; font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: .08em; opacity: .85; }
  .v-tap { position: absolute; left: 0; right: 0; bottom: calc(24px + var(--sab)); font-size: 11px; font-weight: 800; letter-spacing: .26em; text-transform: uppercase; opacity: .8; }
  .v-timer { position: absolute; left: 0; right: 0; top: 0; height: 5px; background: rgba(255,255,255,.25); }
  .v-timer i { display: block; height: 100%; width: 100%; background: #fff; transform-origin: left; animation: shrink var(--t, 1.5s) linear forwards; }
  @keyframes shrink { to { transform: scaleX(0); } }

  /* ---------- sheet + toast ---------- */
  .sheet-bg { position: fixed; inset: 0; z-index: 60; background: rgba(17,17,17,.45); display: flex; align-items: flex-end; justify-content: center; }
  .sheet { width: 100%; max-width: 520px; background: #fff; border-radius: 24px 24px 0 0; padding: 22px 18px calc(22px + var(--sab)); animation: up .2s ease-out; }
  @keyframes up { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet .grip { width: 42px; height: 5px; border-radius: 9px; background: var(--line); margin: -8px auto 14px; }
  .kv { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .kv span { color: var(--mute); }
  .kv b { font-weight: 700; text-align: right; overflow-wrap: anywhere; }
  .toast { position: fixed; left: 50%; bottom: calc(92px + var(--sab)); transform: translateX(-50%); z-index: 90; background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 14px; font-weight: 600; max-width: calc(100% - 36px); box-shadow: 0 10px 30px -10px rgba(0,0,0,.5); animation: up .2s ease-out; }
  .foot { margin-top: 28px; font-size: 11px; color: var(--faint); }
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="logo"><b>TED<sup>x</sup></b><span>ShebeenElkom</span></div>
    <div class="pills" id="pills" hidden>
      <button class="pill" id="net" type="button"><i></i><span>Live</span></button>
      <button class="pill dark" id="laneBtn" type="button">Lane</button>
    </div>
  </div>
  <div class="rule"></div>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs" hidden><div>
  <button type="button" data-tab="scan">Scan</button>
  <button type="button" data-tab="search">Search</button>
  <button type="button" data-tab="sale">Door sale</button>
  <button type="button" data-tab="live">Live</button>
</div></nav>

<script>
(function () {
  'use strict';

  /* =========================================================== storage */
  var K = { api: 'tpx.api', pin: 'tpx.pin', lane: 'tpx.lane', role: 'tpx.role', list: 'tpx.list', queue: 'tpx.queue', event: 'tpx.event' };
  function get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function set(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function getJSON(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }

  var GAS = !!(window.google && google.script && google.script.run);
  var S = {
    api: get(K.api), pin: get(K.pin), lane: get(K.lane) || 'Lane 1', role: get(K.role), event: getJSON(K.event, {}),
    map: new Map(), old: new Map(), queue: getJSON(K.queue, []), online: true, lastSync: 0,
    syncing: false, flushing: false, recent: [], tab: 'scan', verdictOpen: false, alerts: [], camWanted: false
  };

  /* =========================================================== transport */
  function call(req) {
    if (GAS) {
      return new Promise(function (resolve, reject) { google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).api(req); });
    }
    var ctl = new AbortController();
    var t = setTimeout(function () { ctl.abort(); }, 12000);
    return fetch(S.api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(req), redirect: 'follow', signal: ctl.signal })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .finally(function () { clearTimeout(t); });
  }
  function withPin(o) { o.pin = S.pin; return o; }

  /* =========================================================== helpers */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function h(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var a in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, a) || attrs[a] == null || attrs[a] === false) continue;
      if (a === 'text') n.textContent = attrs[a];
      else if (a === 'html') n.innerHTML = attrs[a];
      else if (a.slice(0, 2) === 'on') n.addEventListener(a.slice(2), attrs[a]);
      else n.setAttribute(a, attrs[a] === true ? '' : attrs[a]);
    }
    (kids || []).forEach(function (k) { if (k != null && k !== false) n.appendChild(typeof k === 'string' ? document.createTextNode(k) : k); });
    return n;
  }
  function hhmm(ms) { if (!ms) return ''; var d = new Date(ms); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function first(n) { return String(n || '').trim().split(/\s+/)[0]; }
  function codeFrom(text) {
    var s = String(text || '').trim().toUpperCase();
    var m = s.match(/[?&]C=(TP-[A-Z0-9]{6})/) || s.match(/(?:^|[^A-Z0-9])(TP-[A-Z0-9]{6})(?![A-Z0-9])/) || s.match(/^([A-Z0-9]{6})$/);
    if (!m) return '';
    return m[1].indexOf('TP-') === 0 ? m[1] : 'TP-' + m[1];
  }
  var KIND = { EARLY: 'Early Bird', REGULAR: 'Regular', SQUAD: 'Squad', COMP: 'Invitation', DOOR: 'Door sale' };
  function band(cat) { return cat === 'GENERAL' ? { c: '#EB0028', t: 'Red wristband', s: 'Free seating' } : { c: '#111111', t: 'Black wristband', s: cat + ' · Reserved seating' }; }
  function toast(msg, ms) {
    var old = $('.toast'); if (old) old.remove();
    var t = h('div', { 'class': 'toast', role: 'status', text: msg });
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, ms || 2600);
  }
  var ICON = {
    ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5L19.5 7"/></svg>',
    no: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    bang: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v9"/><path d="M12 19h.01"/></svg>',
    torch: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>'
  };

  /* =========================================================== sound + haptics */
  var actx = null;
  function unlockAudio() { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {} }
  function tone(freq, start, dur, type, vol) {
    if (!actx) return;
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, actx.currentTime + start);
    g.gain.exponentialRampToValueAtTime(vol || 0.25, actx.currentTime + start + 0.01);

        h('div', {}, [h('b', {}, [h('i', { style: 'background:#EB0028' }), String(s.red)]), h('span', { text: 'Red bands' })]),
        h('div', {}, [h('b', {}, [h('i', { style: 'background:#111' }), String(s.black)]), h('span', { text: 'Black bands' })]),
        h('div', {}, [h('b', {}, [String(s.door)]), h('span', { text: 'Door sales' })])
      ])
    ]);
  }
  function refreshNumbers() {
    var old = $('#stats'); if (old) old.replaceWith(numbersBlock());
    if (S.tab === 'live') { var lv = $('#liveBox'); if (lv) renderLive(lv); }
    setOnline(S.online);
  }
  function renderRecent(box) {
    box.innerHTML = '';
    if (!S.recent.length) { box.appendChild(h('div', { 'class': 'empty', text: 'No scans yet on this phone.' })); return; }
    var col = { go: '#0B8A47', stop: '#EB0028', warn: '#F4B400' };
    S.recent.forEach(function (r) {
      box.appendChild(h('div', { 'class': 'r' }, [h('i', { 'class': 'dot', style: 'background:' + (col[r.kind] || '#999') }),
        h('div', { 'class': 'who' }, [h('b', { text: r.name || 'Unknown' }), h('span', { text: r.code })]), h('time', { text: hhmm(r.at) })]));
    });
  }

  /* ---------- desk: search ---------- */
  function showSearch() {
    clear();
    var q = h('input', { 'class': 'input', type: 'search', autocomplete: 'off', placeholder: 'Name, code, or last 4 digits of the phone' });
    var res = h('div'), pend = h('div'), timer = null;
    var run = function () {
      var v = q.value.trim().toLowerCase(), digits = v.replace(/\D/g, '');
      res.innerHTML = ''; pend.innerHTML = '';
      if (v.length < 2) { res.appendChild(h('p', { 'class': 'note', text: 'Search works offline for tickets. Unconfirmed payments need the internet.' })); return; }
      var hits = [];
      S.map.forEach(function (t) {
        var hay = (t.n + ' ' + t.c).toLowerCase();
        if (hay.indexOf(v) >= 0 || (digits.length === 4 && t.p4 === digits)) hits.push(t);
      });
      hits.sort(function (a, b) { return a.n.localeCompare(b.n); });
      if (!hits.length) res.appendChild(h('div', { 'class': 'empty', text: 'No ticket matches.' }));
      hits.slice(0, 25).forEach(function (t) { res.appendChild(ticketCard(t)); });
      clearTimeout(timer);
      if (v.length >= 3) timer = setTimeout(function () {
        call(withPin({ action: 'search', q: v })).then(function (r) {
          pend.innerHTML = '';
          if (!r || !r.orders || !r.orders.length) return;
          pend.appendChild(h('div', { 'class': 'section-h' }, [h('h2', { text: 'Payments not confirmed' }), h('small', { text: r.orders.length + '' })]));
          r.orders.forEach(function (o) {
            pend.appendChild(h('div', { 'class': 'card pend' }, [
              h('h3', {}, [o.name, h('span', { 'class': 'chip wait', text: o.status })]),
              h('div', { 'class': 'meta', html: '' }, [o.order + ' · ' + (KIND[o.type] || o.type) + ' · EGP ' + o.due + ' · ref ', h('code', { text: o.ref })]),
              h('p', { 'class': 'note', text: o.status === 'REJECTED' ? 'This order was rejected. No ticket.' : 'Check this transaction on the tickets line. If the money is there, set the order to PAID in the sheet; the ticket appears here within a minute.' })
            ]));
          });
        }).catch(function () {});
      }, 450);
    };
    q.addEventListener('input', run);
    view.appendChild(h('div', { 'class': 'kicker', text: 'Help Desk' }));
    view.appendChild(h('h1', { text: 'Find a guest' }));
    view.appendChild(h('div', { 'class': 'field' }, [q]));
    view.appendChild(res); view.appendChild(pend);
    run(); q.focus();
  }
  function ticketCard(t) {
    var b = t.cat === 'GENERAL' ? h('span', { 'class': 'chip red', text: 'Red' }) : h('span', { 'class': 'chip black', text: 'Black · ' + t.cat });
    var st = t.st === 'void' ? h('span', { 'class': 'chip void', text: 'Cancelled' }) : t.at ? h('span', { 'class': 'chip in', text: 'In ' + hhmm(t.at) }) : null;
    var acts = h('div', { 'class': 'actions' });
    if (t.st !== 'void' && !t.at) acts.appendChild(h('button', { 'class': 'btn red', type: 'button', onclick: function () { scan(t.c, 'manual'); } }, ['Check in']));
    if (t.st !== 'void' && S.event.ticketBase) {
      var link = S.event.ticketBase + '?c=' + t.c;
      var cp = h('button', { 'class': 'btn ghost', type: 'button' }, ['Copy ticket link']);
      cp.addEventListener('click', function () {
        var done = function () { toast('Ticket link copied. Send it on WhatsApp.'); };
        try { navigator.clipboard.writeText(link).then(done, function () { window.prompt('Copy the link', link); }); } catch (e) { window.prompt('Copy the link', link); }
      });
      acts.appendChild(cp);
    }
    return h('div', { 'class': 'card' }, [
      h('h3', {}, [t.n, b, st]),
      h('div', { 'class': 'meta' }, [h('code', { text: t.c }), ' · ' + (KIND[t.k] || t.k) + (t.p4 ? ' · phone …' + t.p4 : '') + (t.at && t.lane ? ' · ' + t.lane : '')]),
      acts
    ]);
  }

  /* ---------- desk: door sale ---------- */
  function showSale() {
    clear();
    var ev = S.event, s = stats();
    var name = h('input', { 'class': 'input', type: 'text', autocomplete: 'off', placeholder: 'Full name' });
    var phone = h('input', { 'class': 'input', type: 'tel', inputmode: 'numeric', autocomplete: 'off', placeholder: '01xxxxxxxxx', maxlength: '11' });
    var ref = h('input', { 'class': 'input', type: 'text', inputmode: 'numeric', autocomplete: 'off', placeholder: 'From the Vodafone Cash message' });
    var err = h('div', { 'class': 'err' });
    var btn = h('button', { 'class': 'btn red', type: 'button' }, ['Sell ticket']);
    var armed = false, armTimer = null;
    btn.addEventListener('click', function () {
      err.textContent = '';
      if (!armed) {
        if (name.value.trim().length < 3 || !/^01[0125]\d{8}$/.test(phone.value.trim()) || ref.value.trim().length < 4) { err.textContent = 'Fill in the name, an 11-digit mobile number and the transaction number.'; return; }
        armed = true; btn.className = 'btn'; btn.textContent = 'Money received on the line? Tap to confirm';
        armTimer = setTimeout(function () { armed = false; btn.className = 'btn red'; btn.textContent = 'Sell ticket'; }, 6000);
        return;
      }
      clearTimeout(armTimer); armed = false; btn.disabled = true; btn.innerHTML = '<div class="spin"></div>';
      call(withPin({ action: 'doorSale', name: name.value, phone: phone.value, ref: ref.value, lane: S.lane })).then(function (r) {
        btn.disabled = false; btn.className = 'btn red'; btn.textContent = 'Sell ticket';
        if (r.error === 'pin') { signOut('The PIN was changed. Enter the new PIN.'); return; }
        if (r.error) { err.textContent = r.error; return; }
        S.map.set(r.code, { c: r.code, n: r.name, cat: 'GENERAL', k: 'DOOR', at: r.atMs, lane: r.by, st: 'ok', p4: phone.value.slice(-4) });
        name.value = ''; phone.value = ''; ref.value = '';
        verdict({ type: 'ok', name: r.name, cat: 'GENERAL', kind: 'DOOR', code: r.code });
        pushRecent('go', r.name, r.code);
        refreshNumbers();
        $('#saleCount').textContent = r.sold + ' of ' + r.max + ' sold';
      }).catch(function () { btn.disabled = false; btn.className = 'btn red'; btn.textContent = 'Sell ticket'; err.textContent = 'No internet. Door sales need a connection.'; });
    });
    view.appendChild(h('div', { 'class': 'kicker', text: 'Door sale' }));
    view.appendChild(h('div', { 'class': 'price', style: 'margin-top:12px' }, [h('span', { text: 'EGP' }), h('b', { text: String(ev.price || 250) })]));
    view.appendChild(h('div', { 'class': 'note', id: 'saleCount', text: s.door + ' of ' + (ev.doorMax || 40) + ' sold' }));
    view.appendChild(h('ol', { 'class': 'steps' }, [
      h('li', {}, [h('span', {}, ['The guest transfers to Vodafone Cash ', h('b', { 'class': 'vf', text: ev.vf || '—' }), '. No cash.'])]),
      h('li', { text: 'You see the payment message on the tickets line phone yourself. A screenshot from the guest does not count.' }),
      h('li', { text: 'Enter the name, mobile number and transaction number, then confirm.' }),
      h('li', { text: 'The screen turns green: red wristband, and the guest walks in.' })
    ]));
    view.appendChild(h('div', { 'class': 'field' }, [h('label', { text: 'Guest name' }), name]));
    view.appendChild(h('div', { 'class': 'field' }, [h('label', { text: 'Mobile' }), phone]));
    view.appendChild(h('div', { 'class': 'field' }, [h('label', { text: 'Transaction number' }), ref]));
    view.appendChild(h('div', { style: 'margin-top:20px' }, [btn])); view.appendChild(err);
  }

  /* ---------- desk: live ---------- */
  function showLive() {
    clear();
    view.appendChild(h('div', { 'class': 'kicker', text: 'Live' }));
    view.appendChild(h('h1', { text: 'The room' }));
    var box = h('div', { id: 'liveBox' }); renderLive(box); view.appendChild(box);
  }
  function renderLive(box) {
    box.innerHTML = '';
    box.appendChild(numbersBlock());
    var byLane = {};
    S.map.forEach(function (t) { if (t.at && t.st !== 'void') byLane[t.lane || '—'] = (byLane[t.lane || '—'] || 0) + 1; });
    box.appendChild(h('div', { 'class': 'section-h' }, [h('h2', { text: 'By lane' })]));
    var rows = h('div', { 'class': 'rows' });
    Object.keys(byLane).sort().forEach(function (l) { rows.appendChild(h('div', { 'class': 'kv' }, [h('span', { text: l }), h('b', { text: String(byLane[l]) })])); });
    if (!Object.keys(byLane).length) rows.appendChild(h('div', { 'class': 'empty', text: 'Nobody checked in yet.' }));
    box.appendChild(rows);
    box.appendChild(h('p', { 'class': 'note', text: 'Updated ' + (S.lastSync ? hhmm(S.lastSync) : '—') + ' · refreshes every few seconds.' }));
  }

  /* ---------- settings sheet ---------- */
  function showSettings() {
    var laneIn = h('input', { 'class': 'input', type: 'text', value: S.lane });
    var bg = h('div', { 'class': 'sheet-bg' });
    var close = function () { bg.remove(); };
    bg.addEventListener('click', function (e) { if (e.target === bg) close(); });
    bg.appendChild(h('div', { 'class': 'sheet', role: 'dialog' }, [
      h('div', { 'class': 'grip' }),
      h('div', { 'class': 'kicker', text: 'This phone' }),
      h('div', { 'class': 'field' }, [h('label', { text: 'Lane name' }), laneIn]),
      h('div', { style: 'margin-top:14px' }, [h('button', { 'class': 'btn', type: 'button', onclick: function () {
        var v = laneIn.value.trim().replace(/\s+/g, ' ').slice(0, 24); if (v.length < 2) return;
        S.lane = v; set(K.lane, v); $('#laneBtn').textContent = v; close(); toast('Lane saved.');
      } }, ['Save lane'])]),
      h('div', { style: 'margin-top:16px' }, [
        h('div', { 'class': 'kv' }, [h('span', { text: 'Access' }), h('b', { text: S.role === 'desk' ? 'Help Desk' : 'Scanner' })]),
        h('div', { 'class': 'kv' }, [h('span', { text: 'Tickets on this phone' }), h('b', { text: String(S.map.size) })]),
        h('div', { 'class': 'kv' }, [h('span', { text: 'Last update' }), h('b', { text: S.lastSync ? hhmm(S.lastSync) : '—' })]),
        h('div', { 'class': 'kv' }, [h('span', { text: 'Waiting to send' }), h('b', { text: String(S.queue.length) })])
      ]),
      h('div', { 'class': 'actions', style: 'margin-top:16px' }, [
        h('button', { 'class': 'btn ghost', type: 'button', onclick: function () { sync().then(function () { toast('List updated.'); }); flush(); close(); } }, ['Update now']),
        h('button', { 'class': 'btn ghost', type: 'button', style: 'color:#EB0028', onclick: function () {
          if (S.queue.length) { toast(S.queue.length + ' check-ins are not sent yet. Connect to the internet first.'); return; }
          close(); signOut();
        } }, ['Sign out'])
      ])
    ]));
    document.body.appendChild(bg);
  }

  function signOut(msg) {
    stopCamera();
    set(K.pin, null); set(K.role, null); set(K.list, null); set(K.event, null);
    S.pin = ''; S.role = ''; S.map = new Map(); S.old = new Map(); S.recent = [];
    showSetup(msg);
  }

  /* =========================================================== app */
  var timers = [];
  function go(tab) {
    S.tab = tab;
    Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === tab); });
    if (tab === 'search') showSearch(); else if (tab === 'sale') showSale(); else if (tab === 'live') showLive(); else showScan();
  }
  function startApp() {
    $('#pills').hidden = false;
    $('#laneBtn').textContent = S.lane;
    $('#tabs').hidden = S.role !== 'desk';
    go('scan');
    timers.forEach(clearInterval);
    timers = [setInterval(function () { if (!document.hidden) sync(); }, 8000), setInterval(function () { if (!document.hidden) flush(); }, 4000)];
    flush();
  }
  $('#laneBtn').addEventListener('click', showSettings);
  $('#net').addEventListener('click', function () { sync(); flush(); toast(S.online ? 'Connected. ' + S.map.size + ' tickets on this phone.' : 'Offline. Scans are saved and sent when the internet is back.'); });
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) { b.addEventListener('click', function () { go(b.getAttribute('data-tab')); }); });
  window.addEventListener('online', function () { sync(); flush(); });
  window.addEventListener('offline', function () { setOnline(false); });

  // the setup link from the sheet carries the system link in the hash: #api=...
  var m = location.hash.match(/api=([^&]+)/);
  if (m) { try { S.api = decodeURIComponent(m[1]); set(K.api, S.api); } catch (e) {} history.replaceState(null, '', location.pathname + location.search); }

  if (!S.pin || (!GAS && !S.api)) { showSetup(); }
  else { loadCachedList(); startApp(); sync(); }
})();
</script>
</body>
</html>
